---
name: pull_request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Lint commits on this branch
        run: npx commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # internal/overlay renders through real font files and skips itself when
      # none is available. The fonts are committed, so the suite runs against
      # the same face that ships rather than whatever the runner happens to have.
      - name: Fail if the font is missing
        run: test -f assets/font.ttf && test -f assets/font-bold.ttf

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -shuffle=on ./...

      # A skipped test is not a passing test. The overlay suite is the only one
      # that can skip, and it must not in CI.
      - name: Fail if any test skipped
        run: |
          go test ./... -v 2>&1 | tee /tmp/test.log
          if grep -q -- "--- SKIP" /tmp/test.log; then
            echo "::error::tests were skipped in CI"
            grep -- "--- SKIP" /tmp/test.log
            exit 1
          fi

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: yamllint
        run: yamllint .

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
