---
name: push_main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # semantic-release pushes a tag, and a tag pushed with the default
          # GITHUB_TOKEN does not trigger upload_image.yml. GH_RELEASE_PAT is
          # what makes the release actually reach a published image.
          token: ${{ secrets.GH_RELEASE_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/github

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_PAT }}
        run: npx semantic-release
